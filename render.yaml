databases:
  - name: fullstack-todolist-postgres
    databaseName: fullstack_todolist
    user: todolist
    plan: 0.1c-256mb
    region: virginia

services:
  - type: web
    name: fullstack-todolist-backend
    env: python
    plan: free
    region: virginia
    rootDir: .
    buildCommand: pip install -e ".[prod]" && python backend/manage.py collectstatic --noinput && python backend/manage.py migrate --noinput
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/docs/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fullstack-todolist-postgres
          property: connectionString
      - key: ALLOWED_HOSTS
        value: fullstack-todolist-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://fullstack-todolist.pages.dev
      - key: CSRF_TRUSTED_ORIGINS
        value: https://fullstack-todolist.pages.dev
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: minimax/minimax-m2.5:free
      - key: OPENROUTER_SITE_URL
        value: https://fullstack-todolist.pages.dev
      - key: OPENROUTER_APP_NAME
        value: FullStack TodoList
      - key: LLM_TIMEOUT_SECONDS
        value: "20"
      - key: LLM_MAX_TOKENS
        value: "300"
