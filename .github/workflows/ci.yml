name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run frontend tests
        run: bun run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.sha }}
          path: frontend/coverage/
          if-no-files-found: ignore

      - name: Build frontend
        run: bun run build

  backend:
    name: Backend Check and Migrate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install hatchling and dependencies
        run: |
          python -m pip install --upgrade pip hatchling
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check backend/

      - name: Django system check
        working-directory: backend
        env:
          DATABASE_URL: ""
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: python manage.py check

      - name: Run backend tests
        run: pytest --cov-report=xml:backend/coverage.xml

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.sha }}
          path: |
            backend/coverage.xml
            htmlcov/
          if-no-files-found: ignore

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: ""
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: python manage.py migrate --noinput

  e2e:
    name: End-to-end browser tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip hatchling
          pip install -e ".[dev]"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        env:
          CI: "true"
        run: bun run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.sha }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
